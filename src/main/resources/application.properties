spring.application.name=PgERP

spring.datasource.url=${ERP_DB_URL:jdbc:postgresql://localhost:5432/erp}
spring.datasource.username=${ERP_DB_USER:postgres}
spring.datasource.password=${ERP_DB_PASSWORD:}

# PL/pgSQL-функция маршрутизатор: <function>(p_user, p_action, p_form_data JSON, p_lang) RETURNS JSON
erp.dispatcher.function-name=pgerp.handle_ui_event

# Миграции Flyway — только ядро (схема pgerp). Прикладные решения — пакеты db/solutions/<папка> (solution.json и
# выпуски V<n>__….sql): их устанавливает администратор при первом входе или в редакторе, у каждого — своя схема базы
spring.flyway.locations=${ERP_FLYWAY_LOCATIONS:classpath:db/migration}

# Функции ядра лежат в схеме pgerp. У базы search_path = public, pgerp задаёт миграция ядра, но это
# действует только на новые подключения — Flyway получает путь сразу, иначе миграции в том же запуске
# не находят функции ядра.
spring.flyway.init-sqls[0]=SET search_path = public, pgerp

# ---------------------------------------------------------------------
# Развёртывание не на localhost (см. ARCHITECTURE.md, «Развёртывание»)
# ---------------------------------------------------------------------
# Порт и путь приложения: SERVER_PORT=8080, SERVER_SERVLET_CONTEXT_PATH=/erp (клиент использует относительные пути)
# За обратным прокси с HTTPS (nginx, Traefik) нужны заголовки X-Forwarded-Proto/Host/Port: по ним Tomcat
# узнаёт адрес в браузере — для перенаправления на вход, проверки Origin у WebSocket и флага Secure у cookie.
# native принимает их только от прокси из внутренних сетей (10.*, 172.16–31.*, 192.168.*, 127.*);
# прокси с другим адресом — server.tomcat.remoteip.internal-proxies. Без прокси ничего не меняется.
server.forward-headers-strategy=${ERP_FORWARD_HEADERS:native}
# Адреса, с которых открывают PgERP в браузере, если они не совпадают с адресом запроса к приложению
# (прокси без X-Forwarded-Host, другой порт): ERP_ALLOWED_ORIGINS=https://erp.example.com,https://*.corp.local
erp.push.allowed-origins=${ERP_ALLOWED_ORIGINS:}

# ---------------------------------------------------------------------
# Разработка прикладных решений (редактор и MCP-сервер, см. ARCHITECTURE.md, «Разработка решений»)
# ---------------------------------------------------------------------
# Папка пакетов решений в исходниках проекта: выпуск решения сохраняет туда файл (<папка пакета>/V<n>__….sql),
# установка берёт пакеты из неё раньше, чем из сборки, например
# ERP_DEV_SOLUTIONS_DIR=/home/dev/erp-gateway/src/main/resources/db/solutions. Пусто — файл скачивают из редактора.
erp.dev.solutions-dir=${ERP_DEV_SOLUTIONS_DIR:}
# Обновлять установленные решения до последнего выпуска их пакетов при запуске приложения
erp.dev.auto-update=${ERP_SOLUTIONS_AUTO_UPDATE:true}
# Страницы, которым разрешено обращаться к MCP-серверу /mcp из браузера (заголовок Origin). Клиенты MCP Origin
# не присылают; запрос с чужим Origin отклоняется
erp.mcp.allowed-origins=${ERP_MCP_ALLOWED_ORIGINS:}
