# Шрифт по умолчанию — DejaVu Sans из jasperreports-fonts: кириллица, встраивается в PDF
net.sf.jasperreports.default.font.name=DejaVu Sans
net.sf.jasperreports.default.pdf.font.name=DejaVu Sans
net.sf.jasperreports.default.pdf.encoding=Identity-H
net.sf.jasperreports.default.pdf.embedded=true
# Шрифт, которого нет на сервере, — ошибка в шаблоне, а не молчаливая подмена
net.sf.jasperreports.awt.ignore.missing.font=false
